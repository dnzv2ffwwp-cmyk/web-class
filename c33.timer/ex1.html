<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별빛 캐치</title>
  <link rel="stylesheet" href="./css/ex1.css">
  <style>
    * { box-sizing: border-box; }
    :root { --yellow:#ffe36e; --pink:#ff9fc9; --white:#faf8ff; --muted:#aaa5c5; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--white); overflow:hidden;
      font-family:Pretendard,"Noto Sans KR",sans-serif;
      background:radial-gradient(circle at 15% 10%,#4a357b,transparent 30%),radial-gradient(circle at 90% 90%,#173f67,transparent 32%),#090716; }
    main { width:min(940px,calc(100% - 28px)); }
    header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:16px; }
    .tag { margin:0 0 5px; color:var(--pink); font-size:.73rem; font-weight:900; letter-spacing:.18em; }
    h1 { margin:0; font-size:clamp(2rem,5vw,4rem); line-height:1; letter-spacing:-.07em; }
    h1 span { color:var(--yellow); }
    .desc { margin:8px 0 0; color:var(--muted); }
    .stats { display:flex; gap:8px; }
    .stat { min-width:90px; padding:10px 13px; text-align:center; border:1px solid #ffffff20; border-radius:15px; background:#18132dcc; }
    .stat small { display:block; color:var(--muted); font-size:.7rem; }
    .stat strong { font-size:1.4rem; }
    #game { position:relative; height:min(58vh,500px); min-height:380px; overflow:hidden; border:1px solid #ffffff25;
      border-radius:28px; touch-action:none; background:linear-gradient(#15112e 0 68%,#281b45 68%); box-shadow:0 30px 80px #0008; }
    #game::before { content:""; position:absolute; inset:0; opacity:.3; background-image:radial-gradient(#fff 1px,transparent 1px); background-size:38px 38px; }
    .moon { position:absolute; right:8%; top:9%; width:88px; aspect-ratio:1; border-radius:50%; background:#fff0ae; box-shadow:0 0 40px #ffe9a866; }
    .moon::after { content:""; position:absolute; width:90%; aspect-ratio:1; left:-25%; top:-12%; border-radius:50%; background:#15112e; }
    #star { display:none; position:absolute; z-index:3; width:48px; height:48px; color:var(--yellow); font-size:42px; line-height:1;
      pointer-events:auto; cursor:pointer; filter:drop-shadow(0 0 13px #ffe36ecc); animation:shine .6s ease-in-out infinite alternate; }
    #rabbit { position:absolute; z-index:4; left:45%; top:70%; width:58px; height:72px; transition:left .07s linear,top .07s linear; filter:drop-shadow(0 8px 7px #0007); }
    .ear { position:absolute; top:0; width:18px; height:38px; border:4px solid #fff; border-radius:50%; background:var(--pink); }
    .ear.left { left:9px; transform:rotate(-8deg); } .ear.right { right:9px; transform:rotate(8deg); }
    .face { position:absolute; left:3px; bottom:0; width:52px; height:48px; border-radius:48% 48% 44% 44%; background:#fff; }
    .eye { position:absolute; top:19px; width:5px; height:7px; border-radius:50%; background:#211a32; }
    .eye.left { left:13px; } .eye.right { right:13px; }
    .nose { position:absolute; left:23px; top:29px; width:7px; height:5px; border-radius:50%; background:var(--pink); }
    .overlay { position:absolute; z-index:10; inset:0; display:grid; place-content:center; justify-items:center; padding:24px; text-align:center; background:#08061788; backdrop-filter:blur(5px); }
    .overlay.hide { display:none; }
    .avatar { position:relative; width:58px; height:72px; transform:scale(1.25); margin-bottom:15px; }
    .overlay h2 { margin:8px 0; font-size:clamp(1.7rem,4vw,2.6rem); }
    .overlay p { max-width:420px; margin:0 0 20px; color:var(--muted); line-height:1.65; }
    #start { border:0; padding:14px 27px; border-radius:999px; color:#191229; background:var(--yellow); font-size:1rem; font-weight:900; cursor:pointer; box-shadow:0 10px 30px #ffe36e44; }
    .buttons { display:flex; justify-content:center; gap:8px; margin-top:12px; }
    .buttons button { width:52px; height:44px; border:1px solid #ffffff20; border-radius:13px; color:#fff; background:#18132d; font-size:1.2rem; cursor:pointer; }
    .buttons button:active { background:#6a52aa; transform:scale(.94); }
    .guide { margin:8px 0 0; color:var(--muted); text-align:center; font-size:.78rem; }
    .plus { position:absolute; z-index:8; color:var(--yellow); font-weight:900; pointer-events:none; animation:up .65s forwards; }
    @keyframes shine { to { transform:scale(1.16) rotate(8deg); filter:drop-shadow(0 0 22px #ffe36e); } }
    @keyframes up { to { transform:translateY(-45px); opacity:0; } }
    @media(max-width:640px){ header{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1;min-width:0}#game{height:54vh}.desc{font-size:.9rem} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="tag">MOONLIGHT MINI GAME</p><h1>별빛 <span>캐치</span></h1><p class="desc">반짝 나타나는 별을 놓치지 말고 클릭하세요.</p></div>
      <div class="stats" aria-live="polite">
        <div class="stat"><small>모은 별</small><strong id="score">0</strong></div>
        <div class="stat"><small>최고 기록</small><strong id="best">0</strong></div>
        <div class="stat"><small>남은 시간</small><strong><span id="time">30</span>초</strong></div>
      </div>
    </header>
    <section id="game" aria-label="별 모으기 게임 영역">
      <div class="moon"></div><button id="star" type="button" aria-label="별 잡기">★</button>
      <div id="overlay" class="overlay">
        <div class="popup" role="dialog" aria-modal="true" aria-labelledby="title">
          <div class="avatar"><i class="ear left"></i><i class="ear right"></i><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i></div></div>
          <h2 id="title">별빛 캐치에 도전!</h2>
          <p id="message">30초 동안 여기저기 나타나는 별을 최대한 빠르게 클릭해 주세요!</p>
          <button id="start" type="button">게임 시작하기</button>
        </div>
      </div>
    </section>
    <p class="guide">마우스 클릭 · 화면 터치로 별 잡기</p>
  </main>

  <aside id="promoPopup" class="promo-layer" aria-label="루미의 별빛 축제 홍보" role="dialog" aria-modal="true">
    <div class="promo-popup">
      <button id="promoClose" class="promo-close" type="button" aria-label="홍보 팝업 닫기">×</button>
      <img src="./img/popup.png" alt="보름달 아래 마법봉을 들고 날아가는 달토끼 루미">
      <div class="promo-content">
        <p class="promo-label">SPECIAL EVENT</p>
        <h2>루미의 별빛 축제</h2>
        <p>오늘 밤, 루미와 함께 별을 모으고 새로운 최고 기록에 도전해 보세요!</p>
        <button id="promoPlay" class="promo-play" type="button">지금 플레이하기</button>
      </div>
      <div class="promo-bottom">
        <label><input id="hideToday" type="checkbox"> 오늘 하루 보지 않기</label>
        <button id="promoBottomClose" type="button">닫기</button>
      </div>
    </div>
  </aside>

  <script>
    const game=document.querySelector('#game'),star=document.querySelector('#star');
    const overlay=document.querySelector('#overlay'),start=document.querySelector('#start'),scoreEl=document.querySelector('#score');
    const bestEl=document.querySelector('#best'),timeEl=document.querySelector('#time'),title=document.querySelector('#title'),message=document.querySelector('#message');
    let score=0,time=30,timer,playing=false,best=Number(localStorage.getItem('starCatchBest'))||0;
    bestEl.textContent=best;
    function newStar(){
      const maxX=game.clientWidth-star.offsetWidth-20,maxY=game.clientHeight-star.offsetHeight-20;
      star.style.left=10+Math.random()*maxX+'px'; star.style.top=10+Math.random()*maxY+'px';
    }
    function catchStar(event){
      if(!playing)return;
      score++;scoreEl.textContent=score;
      const p=document.createElement('b');p.className='plus';p.textContent='+1';
      p.style.left=star.style.left;p.style.top=star.style.top;
      game.append(p);p.addEventListener('animationend',()=>p.remove());newStar();
    }
    function begin(){
      score=0;time=30;playing=true;scoreEl.textContent=0;timeEl.textContent=30;
      star.style.display='block';overlay.classList.add('hide');newStar();clearInterval(timer);
      timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish();},1000);
    }
    function finish(){
      playing=false;clearInterval(timer);star.style.display='none';
      if(score>best){best=score;localStorage.setItem('starCatchBest',best);bestEl.textContent=best;title.textContent='최고 기록 달성!';}else title.textContent='별빛 캐치 완료!';
      message.textContent=`총 ${score}개의 별을 잡았어요. 한 번 더 도전해 볼까요?`;start.textContent='다시 도전하기';overlay.classList.remove('hide');
    }
    star.addEventListener('pointerdown',catchStar);
    start.addEventListener('click',begin);window.addEventListener('resize',()=>playing&&newStar());

    const promoPopup=document.querySelector('#promoPopup'),promoClose=document.querySelector('#promoClose');
    const promoBottomClose=document.querySelector('#promoBottomClose'),promoPlay=document.querySelector('#promoPlay');
    const hideToday=document.querySelector('#hideToday'),today=new Date().toLocaleDateString('sv-SE');

    function closePromo(){
      if(hideToday.checked)localStorage.setItem('lumiPromoHiddenDate',today);
      promoPopup.classList.add('is-closed');
    }
    if(localStorage.getItem('lumiPromoHiddenDate')===today)promoPopup.classList.add('is-closed');
    promoClose.addEventListener('click',closePromo);
    promoBottomClose.addEventListener('click',closePromo);
    promoPlay.addEventListener('click',()=>{closePromo();begin();});
    promoPopup.addEventListener('click',e=>{if(e.target===promoPopup)closePromo();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!promoPopup.classList.contains('is-closed'))closePromo();});
  </script>
</body>
</html>
