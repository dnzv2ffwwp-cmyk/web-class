<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태그의 속성 편집하기</title>
</head>
<body>
    <figure>
        <img src="./img/정선민.png" alt="ㅅㅁㄴ" class="a">
        <figcaption class="b">ㅊㅇㅅ</figcaption>
    </figure>
    <script>
       const img = document.querySelector('.a')
    //    alert(img.getAttribute('src'))
    img.setAttribute('src','./img/정선민.png')
    const figcaption = document.querySelector('.b')
    // alert(figcaption.textContent)
    // figcaption.innerText = 'ㅅㅁㄴ'
    figcaption.innerHTML = '<h1>ㅅㅁㄴ</h1>'
    figcaption.classList.add('on')
    figcaption.classList.remove('on')
    
    </script>

    <ul class="list">
        <li>1</li>
        <li class="me">2</li>
        <li>3</li>
        <li>4</li>
    </ul>

    <script>
        let me = document.querySelector('.me')
        me.parentElement.style.border = '2px solid pink'
        me.nextElementSibling.style.color = 'lightblue'
        me.previousElementSibling.style.color = 'green'
        let list = document.querySelector('.list')
        let listTags = list.children // [{},{},{}..]
        listTags[0].style.color = 'lightred'
    </script>
</body>
</html>
