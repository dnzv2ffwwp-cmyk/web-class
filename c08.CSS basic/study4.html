<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자의 우선순위 점수</title>
    <link rel="stylesheet" href="./study4.css">
</head>
<body>
    <p>css는 선택자 부분에서 표현 특이점이 높을 수록 우선순위 점수가 높게 적용되며, 이 우선순위 점수가 높은 스타일이 우선 반영된다.</p>
    <ul>
        짱짱 중요~
        <li>태그명 사용 → 1점</li>
        <li>클래스명 사용 → 10점</li>
        <li>아이디명 사용 → 100점</li>
        <li>인라인스타일 사용 → 1000점</li>
        <li>!important → 무조건 적용 (남용 금지)</li>
        <li>css태그는 위에서 아래로 읽기 때문에 윗 순위보다는 아랫 순위의 스타일이 적용된다</li>
    </ul>
    <div class="box">
        <h2 class="a b" id="a" >제목</h2>
        
    </div>
</body>
</html>
