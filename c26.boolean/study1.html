<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boolean</title>
</head>
<body>
    <script>
        !(10<9)
        console.log(!(10<9)) 
    </script>
    <h1>있으면 true 없으면 false</h1>
    <p>false로 간주되는 경우</p>
    <ul>
        <li>숫자데이터인데 값이 0</li>
        <li>문자데이터인데 내용이 없는 경우</li>
        <li>변수를 선언했는데 초기화하지 않은 경우 </li>
        <li>undefined</li>
        <li>null</li>
    </ul>
</body>
</html>
