<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <h1>로그인</h1>
    <p>Wavve 계정으로 로그인</p>
    <form action="#">
        <div>
            <label for="user-id"></label>
            <input type="text" id="user-id" name="user-id" placeholder="이메일 주소 또는 아이디">
        </div>
        <div>
            <label for="user-pw"></label>
            <input type="password" id="user-pw" name="user-pw">
        </div>
    
        <div>
            <input type="checkbox" id="saveid" name="saveid">        
            <label for="saveid">아이디 저장</label>
            <input type="checkbox" id="autologin" name="autologin" name="autologin">
            <label for="autologin">자동 로그인</label>
         </div>
         <button type="submit"> 로그인 </button>
    </form>
    <ul>
        <li><a href="#">아이디 찾기</a></li>
        <li><a href="#">비밀번호 재설정</a></li>
        <li><a href="#">회원가입</a></li>
    </ul>
    <h2>또는 다른 서비스 계정으로 로그인</h2>

    </ul>
<p>SNS계정으로 간편하게 가입하여 서비스를 이용하실 수 있습니다. <br>기존 POOQ 계정 또는 Wavve 계정과는 연동되지 않으니 이용에 참고하세요</p>
</body>
</html>
