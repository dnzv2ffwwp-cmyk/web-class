<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제2</title>
    <link rel="stylesheet" href="./ex2.css">
</head>
<body>
    <main>
        <header>
            <h1>나의 체질량 지수(BMI)</h1>
        </header>

        <section aria-labelledby="bmi-description">
            <p>
                체질량 지수는 자신의 몸무게를 키의 제곱으로 나눈 값입니다.
                체질량 지수는 근육량, 유전적 원인, 다른 개인적 차이를 반영하지 못하는
                단점이 있음에도 불구하고 조사자들이나 의료인들이 가장 많이 쓰는 방법 중 하나입니다.
            </p>
        </section>

        <section class="info" aria-labelledby="bmi-result">
            <table>
                <tbody>
                    <tr>
                        <th scope="row">이름</th>
                        <td id="user-name"></td>
                    </tr>
                    <tr>
                        <th scope="row">체중</th>
                        <td id="weight">kg</td>
                    </tr>
                    <tr>
                        <th scope="row">키</th>
                        <td id="height">cm</td>
                    </tr>
                    <tr>
                        <th scope="row">BMI 지수</th>
                        <td id="bmi"></td>
                    </tr>
                    <tr>
                        <th>상태</th>
                        <td id="condition"></td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="bmi-chart" aria-labelledby="bmi-chart-title">
            <h2 id="bmi-chart-title">BMI 판정표</h2>
            <p class="bmi-status" aria-live="polite">
                현재 상태: <strong id="bmi-category"></strong>
            </p>

            <div class="bmi-scale">
                <div class="bmi-marker" id="bmi-marker">
                    <span id="marker-value"></span>
                </div>
                <div class="bmi-range underweight">저체중</div>
                <div class="bmi-range normal">정상</div>
                <div class="bmi-range overweight">과체중</div>
                <div class="bmi-range obese">비만</div>
            </div>

            <div class="bmi-numbers" aria-hidden="true">
                <span>10</span>
                <span>18.5</span>
                <span>23</span>
                <span>25</span>
                <span>35+</span>
            </div>
        </section>
    </main>

    <script>
        const userName = prompt('성함을 입력하세요')
        const cm = Number(prompt('키를 입력하세요'))
        const kg = Number(prompt('몸무게를 입력하세요'))
        const meter = cm / 100
        const BMI = Number((kg / meter ** 2).toFixed(2))
        const results = [userName, `${kg}kg`, `${cm}cm`, BMI]

        document.querySelectorAll('.info td').forEach((cell, index) => {
            cell.textContent = results[index]
        })

        let category

        if (BMI < 18.5) {category = '저체중'} else if (BMI < 23) {
            category = '정상'
        } else if (BMI < 25) {
            category = '과체중'
        } else {
            category = '비만'
        }
        document.querySelector('#condition').textContent = category
        const markerPosition = Math.min(Math.max((BMI - 10) / 25 * 100, 0), 100)

        document.querySelector('#bmi-category').textContent = category
        document.querySelector('#marker-value').textContent = BMI
        document.querySelector('#bmi-marker').style.left = `${markerPosition}%`
    </script>
</body>
</html>
